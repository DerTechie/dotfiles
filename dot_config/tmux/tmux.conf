# ==============================================================================
# General
# ==============================================================================

# Start numbering windows and panes at 1.
set -g base-index 1
setw -g pane-base-index 1

# Close numbering gaps after deleting windows.
set -g renumber-windows on

# Better interaction with Neovim.
set -sg escape-time 10
set -g focus-events on
setw -g mode-keys vi

# Mouse selection, resizing, scrolling and window switching.
set -g mouse on

# Larger scrollback.
set -g history-limit 100000

# Reload configuration with Prefix + r.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux configuration reloaded"


# ==============================================================================
# Ghostty and colour support
# ==============================================================================

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"


# ==============================================================================
# Status bar
# ==============================================================================

# Put the status bar at the top.
set -g status-position top

set -g status on
set -g status-interval 5
set -g status-justify left

set -g status-left-length 40
set -g status-right-length 80

# Flexoki-inspired dark palette matching the Starship prompt.
set -g status-style "bg=#1C1B1A,fg=#CECDC3"

# Session name on the left.
set -g status-left \
    "#[fg=#3AA99F,bold]  #S  #[fg=#878580,nobold]│"

# Current directory and time on the right.
# Also shows when the tmux prefix is active.
set -g status-right \
    "#{?client_prefix,#[fg=#D0A215,bold] PREFIX #[fg=#878580],}#[fg=#878580]#{b:pane_current_path}  #[fg=#CECDC3]%H:%M "

# Make windows look like tabs.
set -g window-status-separator ""

setw -g window-status-format \
    "#[fg=#878580,bg=#1C1B1A]  #I:#W  "

setw -g window-status-current-format \
    "#[fg=#100F0F,bg=#3AA99F,bold]  #I:#W  "

# Highlight windows with activity without showing an intrusive message.
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style "fg=#D0A215,bold"


# ==============================================================================
# Panes
# ==============================================================================

# Subtle inactive borders and a clear active pane.
set -g pane-border-style "fg=#403E3C"
set -g pane-active-border-style "fg=#3AA99F"

set -g display-panes-colour "#878580"
set -g display-panes-active-colour "#3AA99F"

# More readable command and copy-mode prompts.
set -g message-style "bg=#3AA99F,fg=#100F0F,bold"
set -g mode-style "bg=#3AA99F,fg=#100F0F,bold"
