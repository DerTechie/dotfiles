"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](love)\
$os\
$username\
[](bg:gold fg:love)\
$directory\
[](bg:foam fg:gold)\
$git_branch\
$git_status\
[](bg:iris fg:foam)\
$nodejs\
$python\
$php\
$rust\
$golang\
[ ](fg:iris)\
$cmd_duration\
$line_break\
$character"""

palette = 'rose_pine'

[palettes.rose_pine]
base    = '#191724'
surface = '#1f1d2e'
overlay = '#26233a'
muted   = '#6e6a86'
subtle  = '#908caa'
text    = '#e0def4'
love    = '#eb6f92'
gold    = '#f6c177'
rose    = '#ebbcba'
pine    = '#31748f'
foam    = '#9ccfd8'
iris    = '#c4a7e7'
hl_med  = '#403d52'

[os]
disabled = false
style = "bg:love fg:base"
[os.symbols]
Arch = " "

[username]
show_always = true
style_user = "bg:love fg:base"
style_root = "bg:love fg:base"
format = '[ $user ]($style)'

[directory]
style = "bg:gold fg:base"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bg:foam fg:base"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:foam fg:base"
format = '[$all_status$ahead_behind ]($style)'

[nodejs]
symbol = " "
style = "bg:iris fg:base"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:iris fg:base"
format = '[ $symbol($version) ]($style)'

[php]
symbol = " "
style = "bg:iris fg:base"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = "󱘗 "
style = "bg:iris fg:base"
format = '[ $symbol($version) ]($style)'

[golang]
symbol = " "
style = "bg:iris fg:base"
format = '[ $symbol($version) ]($style)'

[cmd_duration]
min_time = 500
style = "fg:muted"
format = '[  $duration]($style)'

[character]
success_symbol = '[➜](bold fg:foam)'
error_symbol = '[➜](bold fg:love)'
